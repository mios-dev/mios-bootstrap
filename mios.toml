# ----------------------------------------------------------------------------
# [colors] -- MiOS unified palette. Operator neutrals (#1A407F, #E0E0E0,
# #B7C9D7, #948E8E, #734F39) + Hokusai "Great Wave" (#3E7765, #E7DFD3,
# #F35C15, #DC271B, #282262), combined into one 16-slot ANSI mapping
# applied across every console / terminal via /etc/profile.d/mios-colors.sh.
# Vendor canonical block lives at mios.git/usr/share/mios/mios.toml; this
# is the bootstrap-overlay default for first install.
# ----------------------------------------------------------------------------
[colors]
bg          = "#282262"
fg          = "#E7DFD3"
accent      = "#1A407F"
cursor      = "#F35C15"
success     = "#3E7765"
warning     = "#F35C15"
error       = "#DC271B"
info        = "#1A407F"
muted       = "#948E8E"
subtle      = "#B7C9D7"
earth       = "#734F39"
silver      = "#E0E0E0"

ansi_0_black            = "#282262"
ansi_1_red              = "#DC271B"
ansi_2_green            = "#3E7765"
ansi_3_yellow           = "#F35C15"
ansi_4_blue             = "#1A407F"
ansi_5_magenta          = "#734F39"
ansi_6_cyan             = "#B7C9D7"
ansi_7_white            = "#E7DFD3"
ansi_8_bright_black     = "#948E8E"
ansi_9_bright_red       = "#FF6B5C"
ansi_10_bright_green    = "#5FAA8E"
ansi_11_bright_yellow   = "#FF8540"
ansi_12_bright_blue     = "#3D6BA8"
ansi_13_bright_magenta  = "#9D7660"
ansi_14_bright_cyan     = "#E0E0E0"
ansi_15_bright_white    = "#FFFFFF"

# ----------------------------------------------------------------------------
# [bootstrap] -- behavior of mios-bootstrap.git/install.sh during Phase-0.
#   mode: auto | bootc | fhs
#     - auto  : detect host kind, prefer 'bootc switch' when available
#     - bootc : force 'bootc switch' (fail if not bootc-managed)
#     - fhs   : force the Total Root Merge path (clone + overlay)
# Maps to MIOS_BOOTSTRAP_MODE, MIOS_REPO_URL, MIOS_BOOTSTRAP_REPO_URL.
# ----------------------------------------------------------------------------
[bootstrap]
mode             = "auto"
mios_repo        = "https://github.com/mios-dev/mios.git"
bootstrap_repo   = "https://github.com/mios-dev/mios-bootstrap.git"
mios_ref         = "main"                 # pin to a tag or SHA for a reproducible install
bootstrap_ref    = "main"                 # pin to a tag or SHA for a reproducible install
dev_distro       = "MiOS-DEV"             # WSL distro name for podman-MiOS-DEV machine
install_packages = true                   # run dnf install on PACKAGES.md after FHS overlay
reboot_on_finish = true                   # interactive y/N prompt at end of install

# Host data-disk provisioning (Initialize-DataDisk). Operator-locked at 256 GiB
# + 512 MB buffer so Windows Explorer rounds Capacity to "256 GB" not "255 GB".
# NTFS reserves ~16 MB for boot sector / alignment / $MFT.
[bootstrap.host_storage]
shrink_mb         = 262656
# Install-robustness 2026-06-21: floor for the adaptive shrink. When C: cannot
# free the full shrink_mb (256/512 GB SSDs, or a heavily-used C:), Initialize-
# DataDisk clamps the MiOS-DEV partition to the largest fittable size DOWN TO this
# floor instead of hard-aborting; only if even this won't fit does it stop (with
# remediation). 64 GB is enough for the dev VM + a couple of OCI image builds.
min_shrink_mb     = 65536
drive_letter      = "M"
volume_label      = "MIOS-DEV"

# Dev VM (podman-MiOS-DEV) provisioning. base_image is the Fedora bootc base
# the podman-machine VHDX is bootstrapped from before mios-build-driver
# bootc-switches it to localhost/mios:latest.
[bootstrap.dev_vm]
base_image        = "quay.io/podman/machine-os:6.0"

# ----------------------------------------------------------------------------
# [smoke_tests] -- attempts + interval the dev-VM smoketests use during
# bootstrap. Phase-3 brings up the podman-MiOS-DEV machine and runs four
# smoketests (responsive / systemd / overlay / podman API) before declaring
# the dev VM ready. Tunables live here so operators don't need to edit code.
# ----------------------------------------------------------------------------
[smoke_tests]
systemd_attempts        = 15
podman_api_attempts     = 15
interval_seconds        = 2

# ----------------------------------------------------------------------------
# [network.retry] -- backoff schedule for podman pull / git clone / curl
# retries during bootstrap. Each integer is delay-before-next-attempt in
# seconds; len(delays_seconds) = total attempts.
# ----------------------------------------------------------------------------
[network.retry]
delays_seconds          = [0, 5, 15, 30]

# ----------------------------------------------------------------------------
# [profile] -- developer-vs-server-vs-kiosk flavor and feature toggles.
# Maps to MIOS_PROFILE_ROLE, MIOS_PROFILE_FEATURES (comma-joined).
# ----------------------------------------------------------------------------
[profile]
role     = "developer"
features = ["ai", "virtualization", "k3s"]

# ----------------------------------------------------------------------------
# [quadlets.enable] -- per-Quadlet first-boot enablement flags.
# Defaults are all true; the system never disables a service via static
# config. Incompatible deployments are gated via systemd Condition*
# directives in the Quadlet itself. Set a flag to false here only to
# force-disable a service even when it would otherwise run.
# ----------------------------------------------------------------------------
[quadlets.enable]
mios-ai            = true
mios-ceph          = true
mios-k3s           = true
mios-forge         = true
mios-crowdsec-dashboard = true
mios-llm-light          = true
mios-guacamole  = true
mios-pxe-hub    = true
mios-guacamole-postgres = true
mios-guacd              = true

# ----------------------------------------------------------------------------
# [env] -- free-form environment-variable additions. Keys must match POSIX
# env-var rules ([A-Za-z_][A-Za-z0-9_]*). Anything you put here is exported
# verbatim to every script that sources tools/lib/userenv.sh, so it
# propagates throughout the build / install / runtime chain.
# Examples:
#   MIOS_BUILDER_DISTRO = "MiOS-DEV"
#   MIOS_RECHUNK_MAX_LAYERS = "67"
#   MIOS_AI_GRADER = "o3"
# ----------------------------------------------------------------------------
[env]
