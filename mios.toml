# ----------------------------------------------------------------------------
# [colors] -- MiOS unified palette. Operator neutrals (#1A407F, #E0E0E0,
# #B7C9D7, #948E8E, #734F39) + Hokusai "Great Wave" (#3E7765, #E7DFD3,
# #F35C15, #DC271B, #282262), combined into one 16-slot ANSI mapping
# applied across every console / terminal via /etc/profile.d/mios-colors.sh.
# Vendor canonical block lives at mios.git/usr/share/mios/mios.toml; this
# is the bootstrap-overlay default for first install.
# ----------------------------------------------------------------------------
[colors]
# ── Named tokens (the configurator HTML, OSC-aware apps, theming) ─────────
bg          = "#282262"   # deep indigo  (Hokusai sky)            [main bg]
fg          = "#E7DFD3"   # cream         (Hokusai foam)           [main fg]
accent      = "#1A407F"   # operator blue (interactive / link)
cursor      = "#F35C15"   # sunset orange (visible cursor)
success     = "#3E7765"   # wave green
warning     = "#F35C15"   # sunset orange
error       = "#DC271B"   # coral red
info        = "#1A407F"   # operator blue
muted       = "#948E8E"   # warm grey
subtle      = "#B7C9D7"   # pale blue-grey
earth       = "#734F39"   # brown
silver      = "#E0E0E0"   # operator silver

# ── ANSI 16-color slot mapping (terminal palette via OSC-4) ───────────────
# Slot 0..7 are the canonical low colors; 8..15 are the bright variants.
# Programs that emit `\e[31m` etc. resolve through these slots.
ansi_0_black            = "#282262"   # deep indigo
ansi_1_red              = "#DC271B"   # coral red
ansi_2_green            = "#3E7765"   # wave green
ansi_3_yellow           = "#F35C15"   # sunset orange
ansi_4_blue             = "#1A407F"   # operator blue
ansi_5_magenta          = "#734F39"   # brown
ansi_6_cyan             = "#B7C9D7"   # pale blue-grey
ansi_7_white            = "#E7DFD3"   # cream
ansi_8_bright_black     = "#948E8E"   # warm grey
ansi_9_bright_red       = "#FF6B5C"   # lighter coral
ansi_10_bright_green    = "#5FAA8E"   # lighter wave-green
ansi_11_bright_yellow   = "#FF8540"   # lighter sunset
ansi_12_bright_blue     = "#3D6BA8"   # lighter operator blue
ansi_13_bright_magenta  = "#9D7660"   # lighter brown
ansi_14_bright_cyan     = "#E0E0E0"   # operator silver
ansi_15_bright_white    = "#FFFFFF"   # pure white

# ----------------------------------------------------------------------------
# [bootstrap] -- behavior of mios-bootstrap.git/install.sh during Phase-0.
#   mode: auto | bootc | fhs
#     - auto  : detect host kind, prefer 'bootc switch' when available
#     - bootc : force 'bootc switch' (fail if not bootc-managed)
#     - fhs   : force the Total Root Merge path (clone + overlay)
# Maps to MIOS_BOOTSTRAP_MODE, MIOS_REPO_URL, MIOS_BOOTSTRAP_REPO_URL.
# ----------------------------------------------------------------------------
[bootstrap]
mode             = "auto"
mios_repo        = "C:/MiOS"
bootstrap_repo   = "C:/mios-bootstrap"
mios_ref         = "main"                 # pin to a tag or SHA for a reproducible install
bootstrap_ref    = "main"                 # pin to a tag or SHA for a reproducible install
dev_distro       = "MiOS-DEV"             # WSL distro name for podman-MiOS-DEV machine
install_packages = true                   # run dnf install on PACKAGES.md after FHS overlay
reboot_on_finish = true                   # interactive y/N prompt at end of install

# Host data-disk provisioning (Initialize-DataDisk). Operator-locked at 256 GiB
# + 512 MB buffer so Windows Explorer rounds Capacity to "256 GB" not "255 GB".
# NTFS reserves ~16 MB for boot sector / alignment / $MFT.
[bootstrap.host_storage]
shrink_mb         = 262656
# Install-robustness floor for the adaptive shrink. When C: cannot
# free the full shrink_mb (256/512 GB SSDs, or a heavily-used C:), Initialize-
# DataDisk clamps the MiOS-DEV partition to the largest fittable size DOWN TO this
# floor instead of hard-aborting; only if even this won't fit does it stop (with
# remediation). 64 GB is enough for the dev VM + a couple of OCI image builds.
min_shrink_mb     = 65536
drive_letter      = "M"
volume_label      = "MIOS-DEV"

# Dev VM (podman-MiOS-DEV) provisioning. base_image is the Fedora bootc base
# the podman-machine VHDX is bootstrapped from before mios-build-driver
# bootc-switches it to localhost/mios:latest.
[bootstrap.dev_vm]
base_image        = "quay.io/podman/machine-os:latest"

[bootstrap.prereqs]
install_podman_desktop = false
podman_pkg             = "RedHat.Podman-Desktop"
podman_cli_pkg         = "RedHat.Podman"
git_pkg                = "Git.Git"
git_url                = "https://api.github.com/repos/git-for-windows/git/releases/latest"
podman_url             = "https://api.github.com/repos/containers/podman/releases/latest"

[bootstrap.autostart]
enable                 = true

# ----------------------------------------------------------------------------
# [smoke_tests] -- attempts + interval the dev-VM smoketests use during
# bootstrap. Phase-3 brings up the podman-MiOS-DEV machine and runs four
# smoketests (responsive / systemd / overlay / podman API) before declaring
# the dev VM ready. Tunables live here so operators don't need to edit code.
# ----------------------------------------------------------------------------
[smoke_tests]
systemd_attempts        = 15
podman_api_attempts     = 15
interval_seconds        = 2

# ----------------------------------------------------------------------------
# [network.retry] -- backoff schedule for podman pull / git clone / curl
# retries during bootstrap. Each integer is delay-before-next-attempt in
# seconds; len(delays_seconds) = total attempts.
# ----------------------------------------------------------------------------
[network.retry]
delays_seconds          = [0, 5, 15, 30]

# ----------------------------------------------------------------------------
# [profile] -- developer-vs-server-vs-kiosk flavor and feature toggles.
# Maps to MIOS_PROFILE_ROLE, MIOS_PROFILE_FEATURES (comma-joined).
# ----------------------------------------------------------------------------
[profile]
role     = "developer"
features = ["ai", "virtualization", "k3s"]

# ----------------------------------------------------------------------------
# [quadlets.enable] -- per-Quadlet first-boot enablement flags.
# Defaults are all true; the system never disables a service via static
# config. Incompatible deployments are gated via systemd Condition*
# directives in the Quadlet itself. Set a flag to false here only to
# force-disable a service even when it would otherwise run.
# ----------------------------------------------------------------------------
[quadlets.enable]
mios-ai            = true
mios-ceph          = true
mios-k3s           = true
mios-forge         = true
mios-crowdsec-dashboard = true
mios-llm-light          = true
mios-guacamole  = true
mios-pxe-hub    = true
mios-guacamole-postgres = true
mios-guacd              = true

# ----------------------------------------------------------------------------
# [autounattend] -- MiOS custom-Windows ISO pipeline SSOT (WS-XBOX / WS-WEDITION).
# Consumed by mios-uup-fetch.ps1, New-MiOSISO.ps1, ConvertTo-MiOSPreset.ps1, and
# New-MiOSAutounattend.ps1. Every key degrades open to a MiOS default in-script,
# so the pipeline runs even before this section is mirrored into the vendor SSOT
# (mios.git usr/share/mios/mios.toml -- the T-147 configurator surface).
# ----------------------------------------------------------------------------
[autounattend]
computer_name = "MIOS"
# Account that AutoLogon signs into to run OOBE FirstLogon + MiOS provisioning. Empty -> the renamed
# built-in Administrator [autounattend.service].svc_user ("mios-sudo"), so setup runs AS mios-sudo
# BEFORE any desktop -- never a stray interactive "user". (Operator-defined; the setup admin is
# released/re-secured post-setup.)
autologon_user = ""
# UUP Dump source acquisition (T-137). Target the DEV channel -- it carries the
# newest feature IDs (Xbox Full Screen Experience) before they reach Retail.
uup_channel    = "dev"           # dev | beta | releasepreview | retail  (maps to WU ring)
uup_arch       = "amd64"         # amd64 | arm64
uup_edition    = "professional"  # Windows 11 edition (listeditions.php name)
uup_lang       = "en-us"
# Bake THIS build host's third-party/OEM drivers into the image (one-time, at
# build): Export-WindowsDriver -Online -> Add-WindowsDriver offline, so the custom
# ISO boots this hardware out of the box. User-defined; default yes.
bake_host_drivers = true
# Bake a BROAD common driver pack into MiOS-Xbox so it boots + gets online on most hardware:
# chipset (AMD Adrenalin / Intel), base GPU, and network (Realtek / Intel / Qualcomm WiFi+LAN).
bake_driver_packs = true    # inject .inf trees from driver_pack_dir into install.wim + boot.wim (offline; degrade-open)
driver_pack_dir   = ""      # empty -> <build>\driverpacks (populate from MiOS-Repo\drivers). MiOS-PE's portable driver installer covers the rest at runtime.
# AIO-01: embed the mios-bootstrap installer repo into the image (C:\ProgramData\MiOS\repo)
# so a clean deploy is OFFLINE (self-contained USB/bare-metal ISO); MiOS-Host prefers the
# local Get-MiOS.ps1, irm|iex is only an update fallback. ~34 MB minus .git.
embed_repo        = true
# ISO carve + output.
c_partition_gb = 96              # C: size; the REST of the disk -> M:\ (MIOS-DEV)
bootstrap_url  = ""              # empty -> canonical raw Get-MiOS.ps1
# Build scratch + ISO output volume. Empty -> auto-pick the fixed drive with the
# MOST free space (install.wim needs ~15-20 GB; the retired M:\ pin overflowed a
# 95%-full 256 GB volume mid-build). Set e.g. "D:\\MiOSbuild" to force a root.
work_root      = ""
iso_out        = ""              # empty -> <work_root>\MiOS\iso\MiOS-Xbox.iso
iso_label      = "MiOS-Xbox"
# Optional pre-built base ISO for the Build-MiOSXbox.ps1 wrapper. Empty -> the
# wrapper auto-detects a local base, else downloads fresh from UUP Dump.
source_iso     = ""
# Neutralize the debloat DISM can't component-remove (telemetry/AI/Copilot/consumer
# features/OneDrive) via offline registry + service policy (cat/autounattend/
# mios-debloat.json). The deep NTLite CBS component files can't be DISM-deleted, but
# their behaviour is killed. Applies on every build (native + -SourceIso).
debloat        = true

# --- Native minimization (T-137b) --------------------------------------------
# Build the minimal image AT THE SOURCE instead of adding all the bloat then
# stripping it back out (that add-then-remove doubles build time: a full appx
# integration + a full offline Remove-AppxProvisionedPackage pass + a second WIM
# export). The UUP converter's own CustomAppsList (CustomList=1) integrates ONLY
# the keep-set below, AddDrivers bakes host drivers in the single converter pass,
# and Stage-2 DISM then does only what the converter can't (features, Xbox FSE
# reg, Linux-pattern layout, boot payload) -- no appx loop, no re-export.
[autounattend.uup_convert]
native_apps  = true    # CustomList=1: integrate ONLY keep_apps; bloat is never added
add_drivers  = true    # bake host drivers in the converter pass (not a 2nd Stage-2 mount)
slim_build   = true    # skip Stage-2's Export-WindowsImage trim (ResetBase already shrank)
add_updates  = true    # integrate SSU+LCU into the image (ships patched)
reset_base   = true    # StartComponentCleanup /ResetBase -- drop superseded WinSxS
netfx3       = false   # bake .NET 3.5 (older games / anti-cheat) -- opt in
skip_edge    = false   # KEEP Edge (operator wants it)
# The keep-set: the ONLY Store apps integrated (space-separated package names, no
# publisher hash). Everything else the converter would ship is left out entirely.
# Xbox stack + Store/winget + Defender UI + media codecs (gaming/streaming compat).
keep_apps    = "Microsoft.WindowsStore Microsoft.StorePurchaseApp Microsoft.DesktopAppInstaller Microsoft.SecHealthUI Microsoft.ScreenSketch Microsoft.WindowsTerminal Microsoft.GamingApp Microsoft.XboxIdentityProvider Microsoft.XboxGamingOverlay Microsoft.XboxGameOverlay Microsoft.XboxSpeechToTextOverlay Microsoft.Xbox.TCUI Microsoft.HEVCVideoExtension Microsoft.VP9VideoExtensions Microsoft.AV1VideoExtension Microsoft.WebMediaExtensions Microsoft.RawImageExtension Microsoft.HEIFImageExtension Microsoft.WebpImageExtension Microsoft.AVCEncoderVideoExtension Microsoft.MPEG2VideoExtension Microsoft.DolbyAudioExtensions"
# skip_download: regex patterns (over each UUP `out=` filename) the DOWNLOAD-TIME trim in
# mios-uup-fetch.ps1 drops, so the bloat is never PULLED in the first place. CustomList=1
# already removes these at install (they are NOT in keep_apps) -- this just stops wasting
# the bandwidth/disk downloading them. SAFE-ONLY: match only OPTIONAL non-kept consumer
# Store apps -- NEVER a base OS ESD, a runtime framework (VCLibs / NET.Native /
# WindowsAppRuntime / UI.Xaml / Store.Engagement), the target's drivers, or anything in
# keep_apps. Unknown/typo patterns are a harmless no-op (degrade-safe). Edit to taste.
skip_download = "Microsoft.BingNews Microsoft.BingWeather Microsoft.BingSearch Microsoft.Clipchamp Microsoft.GetHelp Microsoft.Getstarted Microsoft.MicrosoftOfficeHub Microsoft.MixedReality.Portal Microsoft.PowerAutomateDesktop Microsoft.MicrosoftSolitaireCollection Microsoft.Todos Microsoft.YourPhone MicrosoftTeams Microsoft.WindowsFeedbackHub microsoft.windowscommunicationsapps Microsoft.People Microsoft.ZuneMusic Microsoft.ZuneVideo MicrosoftCorporationII.QuickAssist Microsoft.OutlookForWindows Microsoft.Copilot Microsoft.Windows.DevHome"
computer_name  = ""              # empty -> inherits [identity].hostname

# [autounattend.xbox] -- Xbox Full Screen Experience "out of the box" (T-140).
# enable=true is the MiOS-XBOX edition default; the base MiOS edition overrides
# to false (the [editions] matrix, T-146, scopes this per-edition). feature_ids
# are Controlled-Feature-Rollout ids that CHANGE PER BUILD -- pin them to the
# target build here (never assume forward/backward portability). Dev-channel
# default = the single stable FSE id; 24H2 retail needs the pair
# "58989070,59765208". The pipeline writes the reg-only FeatureManagement
# override (no vivetool.exe) + a DeviceForm spoof so the toggle surfaces on
# non-handheld hardware. NOTE: the FSE home still requires a signed-in Xbox/MS
# account at first run -- that cannot be pre-baked.
[autounattend.xbox]
enable            = true
feature_ids       = "58989070,59765208"   # Xbox Full Screen Experience (FSE) feature IDs
device_form_spoof = true         # DeviceForm=0x2E so FSE surfaces on desktops/laptops
min_build         = "26200"      # informational: 25H2/Dev FSE floor
# Boot-into-Xbox: the gaming HOME APP + start-on-startup. Operator-chosen LOGGED-OUT
# end state -- boots into the full-screen Xbox chrome at the sign-in wall (no MS
# account baked; a populated dashboard is a hard MS gate that needs one sign-in).
# home_app empty disables Xbox mode; set to a 3rd-party launcher AUMID (Playnite/
# AnyFSE) for a no-signin console home instead of the Xbox app.
home_app          = "Microsoft.GamingApp_8wekyb3d8bbwe!Microsoft.Xbox.App"
start_on_startup  = true         # autounattend Gaming-Configuration StartupToGamingHome
# First-login HYDRATION: the WU-stripped image can't bake the Store-delivered
# Gaming Services / WebView2 / framework deps. MiOS-XBOX-Hydrate.ps1 (ONLOGON task)
# fetches + installs them at first logon (while the user signs into Xbox), retries
# across logins, self-removes when done. Staged into the image by New-MiOSISO.
hydrate_script    = "C:\\ProgramData\\MiOS\\MiOS-XBOX-Hydrate.ps1"

# [autounattend.daemon] -- the always-on boot+interval supervisor (a Task Scheduler
# MINUTE task run as mios-svc, registered in the specialize pass). Each tick keeps
# the WSL service plane warm, health-checks the MiOS endpoints + writes health/logs,
# and auto-updates the repos (restarting the mios-* units on change). The self-
# healing owner that circumvents the fragile one-shot first-boot triggers.
[autounattend.daemon]
enable           = true
tick_seconds     = 60      # cadence for -Loop mode; Task Scheduler drives normal ticks
update_every_min = 30      # git-pull the repos at most this often
auto_update      = true    # pull mios + mios-bootstrap; restart mios-* on change
distro           = "MiOS"
script           = "C:\\ProgramData\\MiOS\\MiOS-Daemon.ps1"

# [autounattend.provision] -- MiOS-Xbox STAGE-1 provisioning driver + full-screen
# progress bar. The reboot-surviving state machine (MiOS-Provision.ps1, a MINUTE task
# run as the RID-500 admin) turns the BAKED-IN seed blobs into a running MiOS brain
# with NO download/build on the critical path, reporting weighted progress into the
# single provision-state.json bar (MiOS-SetupExperience.ps1) that withholds the desktop
# until 100%. Degrade-open: a failed phase shows an error + Esc-to-desktop, never a brick.
[autounattend.provision]
enable            = true    # master switch for the Stage-1 driver + full-screen bar
phase_attempt_cap = 3       # per-phase bounded retries (NOT the old destructive per-boot reset)
phase_timeout_sec = 1800    # per-phase hard timeout -> state:error (degrade-open)
autologon_count   = 6       # re-arm interactive auto-logon this many boots so the bar returns across WSL/podman reboots

# [autounattend.provision.weights] -- OPERATOR-TUNABLE per-phase weights for the ONE
# aggregate bar. They need NOT sum to 100 (the total is normalized by the weight sum),
# so a retuned table stays a valid 0..100 bar. MUST mirror the phase ids in
# MiOS-Progress.psm1 / write-mios-progress.sh. Bigger weight = bigger slice of the bar.
[autounattend.provision.weights]
wsl-feature    = 8     # enable VirtualMachinePlatform + WSL optional features
seed-stage     = 5     # stage/verify the baked seed blobs
wsl-import     = 30    # wsl --import the baked rootfs (the heavy, long slice)
m-volume       = 5     # prepare the M: data volume (non-destructive in Stage-1)
podman-machine = 10    # start the container engine (in-distro by default)
image-load     = 22    # podman load the baked oci-archive (offline)
distro-boot    = 15    # systemd + podman.socket up; endpoint health gate
firstboot      = 5     # finalize, register keep-alive tasks, hand off

# [autounattend.seed] -- the BAKED-IN Stage-1 seed blobs. Build-MiOSSeed.ps1 produces
# them on the MiOS-DEV builder (wsl --export / skopeo|podman save) into `source`;
# New-MiOSISO.ps1 bakes them into the image at ProgramData\MiOS\seed\ when enable=true
# (guarded -- absent seeds fall back to today's embedded Get-MiOS build path);
# MiOS-Provision.ps1 loads them offline. Stage-1 TOLERATES missing seeds.
[autounattend.seed]
enable         = true                          # bake the seed blobs into the image (if present in `source`)
source         = ""                            # build-side seed dir; empty -> <build_root>\MiOS\seed (Build-MiOSSeed.ps1 default)
rootfs         = "mios-rootfs.tar"             # WSL2 rootfs tarball (wsl --import target)
oci_archive    = "mios-image.oci.tar"          # bootc/OCI image as an oci-archive (podman load target)
podman_machine = "podman-machine.tar"          # OPTIONAL podman-machine image (engine normally runs in-distro)
distro         = "MiOS"                         # runtime WSL distro name the rootfs imports as
builder_distro = "MiOS-DEV"                     # source distro Build-MiOSSeed.ps1 exports from
image_ref      = "ghcr.io/mios-dev/mios:latest" # OCI ref the oci-archive carries / is loaded as
install_dir    = "M:\\wsl\\MiOS"               # where wsl --import lands the distro (falls back to C: if M: absent)
build_machine  = false                          # also export a podman-machine image (opt-in; engine runs in-distro by default)

# [autounattend.service] -- MiOS as boot-time SYSTEM services, UP BEFORE LOGON.
# The MiOS WSL2/podman service plane is registered in the SPECIALIZE pass (SYSTEM,
# pre-OOBE, pre-logon) and kept alive by the MiOS-Host ONSTART task -- NOT
# FirstLogonCommands (per-user, post-logon). HARD CONSTRAINT: wsl.exe cannot run
# as LocalSystem (WSL is tied to a user profile), so the task runs under svc_user --
# which IS the built-in Administrator (RID 500), RENAMED. svc_user is NOT a separate
# non-admin account: it is the MiOS AI itself -- an autonomous ADMIN principal that
# runs with the full, UNFILTERED RID-500 token (no UAC filter) + SeBatchLogonRight,
# owns the WSL distro, and drives the whole box. The DESKTOP/Xbox user is a DIFFERENT
# account. Both svc_user (the RID-500 name) and svc_description (its account
# description) are stamped onto RID-500 in the specialize pass, fully SSOT-derived.
# See docs/pre-logon-system-services.md.
[autounattend.service]
enable       = true
svc_user     = "mios-sudo"    # the renamed built-in Administrator (RID 500) = the MiOS AI admin that owns the WSL distro (operator: name it)
svc_description = "MiOS AI -- autonomous system administrator (the renamed built-in Administrator, RID 500)"  # stamped onto the RID-500 account in specialize (operator-editable)
svc_password = ""             # empty -> inherits [identity].default_password (first-boot temp cred)
wsl_distro   = "MiOS"
host_script  = "C:\\ProgramData\\MiOS\\MiOS-Host.ps1"
enable_rdp   = true           # RDP up before logon too (Pro+; Home can't host RDP)

# [autounattend.remote] -- REMOTE-ACCESS + VIRT-INTEGRATION plane, BAKED INTO THE
# IMAGE from factory so every MiOS-XBOX deployment is reachable + host-integrated out
# of the box (Hyper-V enhanced session, KVM/libvirt/QEMU, bare metal). The specialize
# pass (autounattend.service.enable_rdp) turns the RDP LISTENER on -- but the
# interactive desktop account ALSO needs "Remote Desktop Users" membership + the
# SeRemoteInteractiveLogonRight, or Hyper-V ENHANCED SESSION refuses the sign-in with
# "you need the right to sign in through Remote Desktop Services." That group-add
# CANNOT run at specialize (the account is created later, in oobeSystem), so the
# pipeline renders mios-remote.cmd from SSOT and SetupComplete runs it as SYSTEM
# (post-account, pre-logon). OpenSSH.Server + sshd autostart, WinRM, and the virtio-win
# guest drivers are baked offline into install.wim. All SSOT-gated + non-fatal.
[autounattend.remote]
enable            = true    # master switch for the whole remote-access bake
grant_rdp_users   = true    # add the desktop account(s) to Remote Desktop Users (fixes enhanced-session sign-in)
rdp_nla           = true    # RDP-Tcp UserAuthentication (NLA). true = secure default; false = most permissive
openssh_server    = true    # bake OpenSSH.Server (offline FoD, online fallback) + sshd/ssh-agent autostart + fw
enable_psremoting = true    # WinRM / PowerShell remoting (Enable-PSRemoting) for host mgmt
bake_virtio       = true    # inject virtio-win guest drivers offline (KVM/QEMU/libvirt portability); non-fatal
virtio_url        = ""      # empty -> canonical fedorapeople latest/beta virtio-win.iso
virtio_browser_fetch = "auto" # auto|true|false: browser-download virtio-win.iso (fedorapeople is Anubis-walled; a browser solves it). 'auto' = do it when a user session is present; the build PAUSES until the ISO lands + is auto-transported to the cache. Set 'false' for headless CI.
virtio_variant    = "w11"   # driver subtree to inject (w11 | w10); amd64 arch under it
loopback_adapter  = false   # install a Microsoft KM-TEST loopback NIC (niche; opt-in)
onlogon_fallback  = true    # register a proven-specialize-pass ONLOGON task that re-applies identity+remote if Setup skips SetupComplete on 26xxx

[[autounattend.accounts]]
name = "user"
password = "user"
display_name = "User"
group = "Administrators"

[autounattend.layout]
strip_defaults = true
strip_folders = "3D Objects;Contacts;Favorites;Links;Saved Games;Searches;OneDrive"
linux_tree = "etc usr var home opt srv tmp bin lib root"
lowercase_userfolders = true
strip_thispc = "{0DB7E03F-FC29-4DC6-9020-FF41B59E513A}"

# ----------------------------------------------------------------------------
# [env] -- free-form environment-variable additions. Keys must match POSIX
# env-var rules ([A-Za-z_][A-Za-z0-9_]*). Anything you put here is exported
# verbatim to every script that sources tools/lib/userenv.sh, so it
# propagates throughout the build / install / runtime chain.
# Examples:
#   MIOS_BUILDER_DISTRO = "MiOS-DEV"
#   MIOS_RECHUNK_MAX_LAYERS = "67"
#   MIOS_AI_GRADER = "o3"
# ----------------------------------------------------------------------------
[env]


[packages.windows]
# Windows-side winget package list installed by mios-bootstrap's
# Get-MiOS.ps1 Pass-1 (current-user scope). Read by the bootstrap
# at install time -- this is the SSOT for "what gets installed on
# the operator's Windows host"; the hardcoded list previously in
# Get-MiOS.ps1 has been removed in favor of this section per
# operator instruction "ALL Global packages SOURCE FROM THE
# TOML/HTML FILE!!!".
#
# To override per-operator: drop a [packages.windows] table in
# ~/.config/mios/mios.toml with your own pkgs = [...] -- replaces
# this list field-for-field per the layered TOML resolver.
#
# Default = strictly-needed runtime/toolchain + MiOS terminal CLI
# surface only. No browser/editor/utility GUIs (operator brings
# their own). Bloat-free per 2026-05 directive.
enable = true
pkgs = [
    # ── Critical runtime / toolchain ─────────────────────────────
    "Git.Git",                       # git for clone + fetch + reset
    "Microsoft.PowerShell",          # pwsh 7 (trampoline target)
    "Microsoft.WSL",                 # Windows Subsystem for Linux 2
    "Microsoft.WindowsTerminal",     # WT (also installed earlier; idempotent)
    "7zip.7zip",                     # archive support
    "Microsoft.VCRedist.2015+.x64",  # VC++ runtime
    "Python.Python.3.14",            # python 3.14 (matches MiOS-DEV 3.14.x) -- host-side MiOS python tooling
    # ── MiOS terminal CLI surface (mirrors the deployed Linux side) ─
    "sharkdp.bat",                   # syntax-highlighted cat
    "sharkdp.fd",                    # fast find
    "BurntSushi.ripgrep.MSVC",       # rg
    "junegunn.fzf",                  # fuzzy finder
    "jqlang.jq",                     # JSON query
    "GitHub.cli",                    # gh
    "aristocratos.btop4win",         # btop (Windows port)
    "fastfetch-cli.fastfetch",       # fastfetch
]

# Post-install PATH verification probes -- the binaries build-mios.ps1's
# Install-MiosWindowsTools loops through to confirm `Get-Command <name>`
# resolves after the winget installs + PATH augmentation. Operators who
# add a custom package above (or remove the default set) extend / shrink
# this list to match.
verify_probes = [
    "python",
    "fastfetch",
    "btop",
    "rg",
    "fzf",
    "jq",
    "gh",
    "bat",
    "fd",
    "pwsh",
    "oh-my-posh"
]

# ─── Browser AI: Zen Twilight wired to the MiOS OWUI pipeline ─────────────────
# Installs Zen Browser (Twilight channel, Firefox-based) on the Windows host and
# points Firefox/Zen's built-in AI chatbot SIDEBAR at the local OWUI / MiOS-Agent
# pipeline -- MiOS AI, natively in the browser. Applied by mios-bootstrap
# (install-host-tools.ps1 Configure-MiosBrowserAI): installs `package` via winget,
# then writes these as a per-profile user.js (the reliable method) plus a
# best-effort distribution/policies.json, so Zen's AI sidebar drives the MiOS
# pipeline. All operator-tunable here (SSOT); the installer hardcodes nothing.
[browser_ai]
enable       = true
package      = "Zen-Team.Zen-Browser.Twilight"   # Zen Browser - Twilight (winget id)
provider_url = "http://localhost:8033"            # OWUI front door = the MiOS AI pipeline
# Firefox/Zen prefs as "name|type|value" (type = bool|string|int) so the bootstrap
# can build policies.json without a full TOML parser. Add Zen-specific zen.* AI
# flags here as they stabilise -- they flow through unchanged.
prefs = [
    "browser.ml.enable|bool|true",                # master ML/AI toggle
    "browser.smartwindow.enabled|bool|true",      # the NEW AI Window (Smart Window) mode -- replaces the old sidebar
    "browser.ml.chat.enabled|bool|true",          # AI chatbot sidebar (fallback path)
    "browser.ml.chat.hideLocalhost|bool|false",   # REQUIRED so a localhost (OWUI) provider is allowed
    "browser.ml.chat.shortcuts|bool|true",        # AI prompts on text selection
    "browser.ml.chat.menu|bool|true",             # AI entries in the context menu
    "browser.ml.pageAssist.enabled|bool|true",    # page-assist AI
    "browser.ml.linkPreview.enabled|bool|true",   # AI link previews
]

[agent_pipe]
tool_max_iters = 15
replan_max = 5
tool_loop_limit = 15
reflexion_limit = 5
no_progress_window = 3
max_consecutive_failures = 3
wall_clock_budget_s = 300
reflexion_enable = true

# ─── Editions Matrix ─────────────────────────────────────────────────────────
# Defines the different flavors/editions of MiOS that can be built by the
# pipeline (T-146). The build scripts can load an edition profile to override
# the default autounattend and branding keys from a single SSOT.
[editions.mios]
autounattend.uup_channel     = "retail"
autounattend.uup_arch        = "amd64"
autounattend.posture         = "B"
autounattend.debloat_profile  = "minimal"
autounattend.xbox.enable     = "false"
colors.accent                = "#1A407F"
branding.living_wallpaper    = "false"

[editions.mios-xbox]
autounattend.uup_channel     = "dev"
autounattend.uup_arch        = "amd64"
autounattend.posture         = "C"
autounattend.debloat_profile  = "gaming"
autounattend.xbox.enable     = "true"
colors.accent                = "#282262"
branding.living_wallpaper    = "true"

[editions.mios-xbox-arm]
autounattend.uup_channel     = "dev"
autounattend.uup_arch        = "arm64"
autounattend.posture         = "C"
autounattend.debloat_profile  = "gaming"
autounattend.xbox.enable     = "true"
colors.accent                = "#4B105C"
branding.living_wallpaper    = "true"



# ----------------------------------------------------------------------------
# [cat] -- MiOS-Cat unified USB installer + launcher/build configuration (SSOT for the
# cat/ entry point). Consumed by cat/MiOS-Cat.{bat,ps1,sh}. Consolidates the former
# [medicat] block (T-258b). Empty ("") launcher paths mean "use the built-in portable
# %~dp0-relative resolution" so a MiOS-Repo USB stays self-contained; set an ABSOLUTE
# path only to OVERRIDE. (ADR-0008)
#   drivepath      : target USB drive letter, no colon
#   medicatver     : MediCat recovery-payload version (filename + cache path)
#   cache_path     : absolute path to the cached MediCat 7z archive
#   ventoy_version : "latest" -> resolve newest Ventoy upstream at build/runtime; MiOS
#                    never hand-pins a fallback (SBOM records the resolved version). ADR-0003
#   xbox_builder   : PowerShell script that builds the MiOS-Xbox ISO ('' -> cat/autounattend/Build-MiOSXbox.ps1)
#   build_driver   : OCI/disk-image build entry ('' -> build-mios.ps1, self-provisions the podman machine)
#   log_path       : directory for the launcher's build/stage logs ('' -> beside the launcher)
# ----------------------------------------------------------------------------
[cat]
monitor_enabled   = true
show_live_monitor = true
drivepath         = "D"
filesystem        = "NTFS"
partition_scheme  = "GPT"
secure_boot       = "Enabled"
build_xbox        = "Enabled"
gaming_optimize   = "Enabled"
medicatver        = "21.12"
cache_path        = "M:\\MediCat.USB.v21.12.7z"
ventoy_version    = "latest"
xbox_builder      = ""
build_driver      = ""
log_path          = ""

# ----------------------------------------------------------------------------
# [cat.live_chat] -- W10: MiOS-Cat zero-install live-USB-to-AI-chat. The OS-side
# build (automation/build/live-iso.sh, Linux) reads the canonical nested keys via
# the section-aware mios_toml.py; MiOS-Cat.bat's regex loader is section-AGNOSTIC
# (first top-level `key = "..."` wins), so the flat live_chat_* aliases give it
# globally-unique, QUOTED names to grep without colliding with other tables'
# enabled/iso_name. model/model_fallback are short keys into [ai].bake_models --
# NOT a third model pin. port mirrors MIOS_AI_ENDPOINT (:8642).
# ----------------------------------------------------------------------------
[cat.live_chat]
enabled            = true
model              = "lfm2-700m"
model_fallback     = "granite-4.1-8b"
port               = 8642
ctx_size           = 8192
threads            = 0
iso_name           = "MiOS-Live-Chat.iso"
live_chat_enabled  = "true"                     # .bat-loader alias of `enabled`
live_chat_iso_name = "MiOS-Live-Chat.iso"       # .bat-loader alias of `iso_name`
live_chat_iso_src  = "M:\\MiOS-Live-Chat.iso"   # where MiOS-Cat.bat looks for a pre-built ISO

# ----------------------------------------------------------------------------
# [cat.sysrescue] -- SystemRescue (Arch) live rescue: SSH + remote access, defined
# ONCE here and PROJECTED to every surface: rendered at build/flash time into the
# Ventoy grub.cfg boot options (Render-Sysrescue.ps1) AND read at RUNTIME by the
# autorun firstboot script (01-sysrescue-firstboot.sh) off the flashed mios.toml.
# `password` empty -> the ONE first-boot cred [identity].default_password (same
# chain as [autounattend.service].svc_password). nofirewall is MANDATORY for inbound
# SSH: SystemRescue's default iptables/ip6tables block EVERY incoming connection incl.
# sshd -- omitting it is why remote access never worked. ar_source_label = the Ventoy
# data-partition volume label the autorun scanner mounts to find the firstboot script.
# ----------------------------------------------------------------------------
[cat.sysrescue]
enable            = true
username          = "mios"
password          = ""            # empty -> [identity].default_password (one SSOT cred)
root_login        = true
nofirewall        = true          # REQUIRED: default SystemRescue firewall blocks inbound sshd
ar_source_label   = "MiOS-Cat"    # Ventoy data-partition label the autorun scanner mounts
connection_header = true          # print live IP + hardware banner on every boot AND every login
wipe_passphrase   = "mios"        # generic default passphrase gating the "Wipe MiOS" GRUB menu entry

[security.luks]
enabled = false
pin = "tpm2"
pcrs = "7"

[gpu.vendors]
nvidia = true
amd = true
intel = true

[greenboot]
critical_services = ["agent-pipe", "llm-light", "pgvector"]

[agent_pipe.quality]
min_length  = 5
check_json  = true
check_punt  = true
check_empty = true

[mini]
enabled = false
guest_cpu_percent = 80
guest_ram_percent = 80
dgpumode = "vfio-pci"

[mini.mesh]
enabled = false
headscale_domain = "mesh.mios.internal"
vnet_cidr = "10.42.0.0/16"
swtpm_vtpm = true

