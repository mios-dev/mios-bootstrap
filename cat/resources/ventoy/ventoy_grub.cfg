# =====================================================================
#  MiOS-Cat  --  Ventoy GRUB2 Unified Operator Menu (SecureBoot / UEFI / GPT)
#  Logically organized into clean operator functional zones:
#    [ Live AI ]      -> boot ephemeral MiOS + bundled local AI, zero install
#    [ Deploy ]       -> stand MiOS up on this machine (Linux / Xbox Windows)
#    [ Recovery ]     -> boot live repair environments (WinPE / SystemRescue Arch)
#    [ Management ]   -> firmware recovery & system control
#  Every entry is MEDIA-GUARDED (`if search --file`) so it appears ONLY
#  when that image was actually staged onto the USB -- zero dead rows.
# =====================================================================

insmod usb
insmod uhci
insmod ohci
insmod ehci
insmod xhci
insmod usbkeyboard
insmod fat
insmod chain

# ---------------------------------------------------------------------
#  ZONE 1: LIVE EPHEMERAL AI  --  RAM-resident, zero changes to host
# ---------------------------------------------------------------------

if search --file --set=root /Live_Operating_Systems/MiOS-Live-Chat.iso; then
menuentry "⚡ Chat with MiOS AI          [ Live RAM System -- zero host install / disk footprint ]" --class linux {
    search --set=root --file /Live_Operating_Systems/MiOS-Live-Chat.iso
    chainloader /Live_Operating_Systems/MiOS-Live-Chat.iso
}
fi

# ---------------------------------------------------------------------
#  ZONE 2: DEPLOYMENT  --  Automated bare-metal install & provisioning
# ---------------------------------------------------------------------

if search --file --set=root /Live_Operating_Systems/Fedora-Server.iso; then
menuentry "🐧 Deploy MiOS Linux         [ Automated Bare-Metal -- Fedora Server + MiOS Sovereign Overlay ]" --class fedora {
    search --set=root --file /Live_Operating_Systems/Fedora-Server.iso
    chainloader /Live_Operating_Systems/Fedora-Server.iso
}
fi

if search --file --set=root /Live_Operating_Systems/MiOS-Xbox.iso; then
menuentry "🎮 Deploy MiOS-Xbox          [ Gaming Edition -- Windows 11 + CompactOS Compression + Debloated ]" --class windows {
    search --set=root --file /Live_Operating_Systems/MiOS-Xbox.iso
    chainloader /Live_Operating_Systems/MiOS-Xbox.iso
}
fi

if search --file --set=root /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim; then
menuentry "💻 Deploy MiOS-Xbox (WinPE)  [ DISM Bare-Metal Installer -- Automated Partition & Provisioning ]" --class windows {
    set vtoy_wimboot_val="1"
    search --set=root --file /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim
    chainloader /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim
}
fi

# ---------------------------------------------------------------------
#  ZONE 3: RECOVERY & REPAIR  --  Live diagnostics & rescue tools
# ---------------------------------------------------------------------

if search --file --set=root /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim; then
menuentry "🛠️  MiOS-Cat Recovery (WinPE)  [ Mini Windows PE -- Live Partitioning, DISM & Hardware Tools ]" --class windows {
    set vtoy_wimboot_val="1"
    search --set=root --file /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim
    chainloader /Live_Operating_Systems/Mini_Windows/MiOS_PE.wim
}
fi

if search --file --set=root /Live_Operating_Systems/SystemRescue/SystemRescue.iso; then
menuentry "🛡️  SystemRescue (Arch Linux) [ Latest Arch Rescue -- Disk Partitioning, File Recovery & CLI ]" --class arch {
    search --set=root --file /Live_Operating_Systems/SystemRescue/SystemRescue.iso
    chainloader /Live_Operating_Systems/SystemRescue/SystemRescue.iso
}
fi

# ---------------------------------------------------------------------
#  ZONE 4: FIRMWARE & SYSTEM CONTROL
# ---------------------------------------------------------------------

if search --file --set=root /EFI/shell.efi; then
menuentry "⚙️  UEFI Shell                [ Low-Level Firmware Diagnostics & Recovery Shell ]" --class recovery {
    terminal_output console
    chainloader /EFI/shell.efi
}
fi

menuentry "🔄 Reboot System" --class restart {
    reboot
}

menuentry "🔌 Power Off" --class shutdown {
    halt
}
