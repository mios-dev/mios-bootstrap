# AI-hint: Default configuration for aichat/aichat-ng that redirects OpenAI-compatible requests to the local Agent-Pipe Quadlet at http://localhost:8700/v1, ensuring seamless local LLM integration for all users.
model: openai:qwen3.5:2b
temperature: null
top_p: null

save: true
keybindings: emacs
editor: null
wrap: auto
wrap_code: false
highlight: true
light_theme: false
save_session: null
compress_threshold: 4000

clients:
  # Canonical 'MiOS' OpenAI-compatible endpoint (Agent-Pipe Quadlet).
  - type: openai-compatible
    name: mios-ai
    api_base: http://localhost:8700/v1
    api_key: ""
    models:
      - name: MiOS AI
        max_input_tokens: 32768
        supports_function_calling: true
      - name: qwen2.5-coder:14b
        max_input_tokens: 32768
        supports_function_calling: true
      - name: nomic-embed-text
        type: embedding
        max_input_tokens: 8192
        default_chunk_size: 1500
        max_batch_size: 64
