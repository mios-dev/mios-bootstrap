# Global options
set timeout=2
set default=0
set fallback=1
set pager=1

# --- Auth: password-protect ONLY the "Wipe MiOS" entry (superuser-only) -------------------
# `set superusers` ARMS GRUB deny-by-default, so EVERY other menuentry MUST carry
# `--unrestricted` or it would ALSO prompt for the password (do not remove those flags).
# Plaintext `password` is valid and needs no pbkdf2 module. The passphrase `mios` here is the
# degrade-open DEFAULT; Render-Sysrescue.ps1 rewrites it from mios.toml
# [cat.sysrescue].wipe_passphrase at flash time. NOTE: this is a deliberate-action speed-bump
# on the one-click wipe menu path, NOT a security boundary -- the open SSH entries still give
# a full root live env, and the passphrase sits in cleartext on the USB. Keep it simple
# alphanumeric (GRUB word-splits the line: no spaces / $ # { } ; / quotes).
set superusers="rescue"
password rescue mios

# Display settings
if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=1024x768
    set color_normal=white/black
    set color_highlight=yellow/black
    set menu_color_normal=white/black
    set menu_color_highlight=yellow/black
	insmod efi_gop
	insmod efi_uga
	insmod gfxterm
	insmod all_video
	insmod videotest
	insmod videoinfo
	terminal_output gfxterm
fi

menuentry "Boot SystemRescue (Arch Linux) using default options [SSH Enabled]" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed rootpass=mios nofirewall setkmap=us ar_source=/dev/disk/by-label/MiOS-Cat ar_suffixes=0
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Boot SystemRescue and copy system to RAM (copytoram) [SSH Enabled]" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed copytoram rootpass=mios nofirewall setkmap=us ar_source=/dev/disk/by-label/MiOS-Cat ar_suffixes=0
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Boot SystemRescue and verify integrity of medium (checksum)" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed checksum
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Boot SystemRescue using basic display drivers (nomodeset)" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed nomodeset rootpass=mios nofirewall setkmap=us ar_source=/dev/disk/by-label/MiOS-Cat ar_suffixes=0
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

# Superuser-only: `--users ""` = superusers list only. This is the ONLY entry without
# --unrestricted, so it is the ONLY one that prompts for the `rescue` passphrase.
menuentry "Wipe MiOS" --users "" {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed rootpass=mios nofirewall setkmap=us ar_source=/dev/disk/by-label/MiOS-Cat ar_suffixes=9
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Boot a Linux operating system installed on the disk (findroot)" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed findroot
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Stop during boot process before mounting root filesystem (break)" --unrestricted {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed break
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry "Start EFI Shell" --unrestricted {
    insmod fat
    insmod chain
    terminal_output console
    chainloader /EFI/shell.efi
}

menuentry "EFI Firmware setup" --unrestricted {
    fwsetup
}

menuentry "Reboot" --unrestricted {
    reboot
}

menuentry "Power off" --unrestricted {
    halt
}
